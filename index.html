<!DOCTYPE html>
<html>

<head>
  <title>TS Token Saver</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #1e1e1e;
      color: white;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: #2d2d2d;
      color: #85c46c;
      border: 1px solid #444;
    }

    button {
      padding: 10px 20px;
      background: #007acc;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #005f9e;
    }
  </style>
</head>

<body>
  <h2>TypeScript LLM Minifier</h2>
  <p>Paste code below to strip comments and extra whitespace (Preserves variable names).</p>

  <textarea id="input" placeholder="Paste your TS code here..."></textarea>
  <br>
  <button onclick="minify()">Minify for LLM</button>

  <h3>Output (Copy this to Chat)</h3>
  <textarea id="output" readonly></textarea>

  <script>
    function minify() {
      let code = document.getElementById('input').value;

      code = code.replace(/\/\*[\s\S]*?\*\//g, "");
      code = code.replace(/\/\/.*/g, "");
      code = code.replace(/\s+/g, " ").trim();

      document.getElementById('output').value = code;
    }
  </script>
</body>

</html>
